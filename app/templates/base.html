<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{% block title %}{{ survey.title }}{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if preview %}<div class="preview-banner">Preview: this survey is a draft and only visible to you. Responses are saved; use “Delete all responses” before opening.</div>{% endif %}
<main class="wrap narrow">
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
