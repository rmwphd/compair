[project]
name = "compair"
version = "0.1.0"
description = "Self-hosted pairwise comparison surveys with demographic group analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "markdown>=3.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
notebook = ["jupyterlab>=4", "matplotlib>=3.8", "statsmodels>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.uv]
package = false
